name: Rust Windows
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace --all-targets
      - run: cargo build --locked --release -p orbit-axion --bins
      - run: python packaging/windows-msi/collect_notices.py
      - run: python packaging/windows-msi/build_msi.py target/release/orbit-axion.exe dist/OrbitAxion-0.2.4-x64.msi 0.2.4
      - uses: actions/upload-artifact@v4
        with:
          name: OrbitAxion-windows-x64
          path: |
            dist/OrbitAxion-0.2.4-x64.msi
            dist/THIRD_PARTY_NOTICES.txt
            target/release/orbit-axion.exe
