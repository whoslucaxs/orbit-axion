name: Rust Windows
on:
  push:
    paths-ignore: ['README.md', 'CHANGELOG.md', 'docs/**']
  pull_request:
    paths-ignore: ['README.md', 'CHANGELOG.md', 'docs/**']
  workflow_dispatch:
    inputs:
      upload_artifacts:
        description: 'Enviar EXE/MSI para o armazenamento do Actions (requer cota disponível)'
        type: boolean
        default: false
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  check:
    name: Validate and package Windows
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Run unit tests
        run: cargo test --locked --workspace --all-targets
      - name: Build Windows executables
        run: cargo build --locked --release -p orbit-axion --bins
      - name: Package and verify MSI
        shell: pwsh
        run: |
          $orbitVersion = python -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version'])"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python packaging/windows-msi/collect_notices.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python packaging/windows-msi/build_msi.py target/release/orbit-axion.exe "dist/OrbitAxion-$orbitVersion-x64.msi" $orbitVersion
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item target/release/orbit-axion.exe "dist/OrbitAxion-$orbitVersion.exe"
          Get-FileHash "dist/OrbitAxion-$orbitVersion.exe", "dist/OrbitAxion-$orbitVersion-x64.msi" -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content dist/SHA256SUMS.txt
          "## Orbit Axion $orbitVersion" >> $env:GITHUB_STEP_SUMMARY
          "Compilação, testes e verificação do conteúdo do MSI concluídos." >> $env:GITHUB_STEP_SUMMARY
          "Upload é opcional: execute manualmente com upload_artifacts habilitado e cota disponível." >> $env:GITHUB_STEP_SUMMARY
          Get-Content dist/SHA256SUMS.txt >> $env:GITHUB_STEP_SUMMARY
      - name: Publish release automatically
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: ./.github/scripts/publish-release.ps1
      - name: Upload packages (manual opt-in)
        if: github.event_name == 'workflow_dispatch' && inputs.upload_artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OrbitAxion-windows-x64
          retention-days: 3
          if-no-files-found: error
          path: |
            dist/OrbitAxion-*.msi
            dist/OrbitAxion-*.exe
            dist/THIRD_PARTY_NOTICES.txt
            dist/SHA256SUMS.txt
