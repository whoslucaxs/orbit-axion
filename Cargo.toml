[workspace]
members = ["crates/core", "crates/windows-platform", "crates/audio", "crates/app"]
resolver = "3"

[workspace.package]
version = "0.2.2"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-only"

[workspace.dependencies]
orbit-core = { path = "crates/core" }
orbit-windows = { path = "crates/windows-platform" }
orbit-audio = { path = "crates/audio" }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_UI_Accessibility", "Win32_UI_Input_Ime", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Registry", "Win32_Storage_FileSystem", "Win32_System_Power", "Win32_System_Shutdown", "Win32_Security", "Win32_Globalization", "Win32_Devices_FunctionDiscovery", "Win32_UI_Shell_PropertiesSystem", "Win32_Media_Multimedia", "Win32_System_ProcessStatus", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints"] }
